name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy static portfolio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build static site
        run: npm run build
      - name: Smoke-test portfolio, chatbot and current CV
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/resume.pdf
          test -s dist/favicon.svg
          grep -Rqs 'Portfolio Assistant' dist/assets
          grep -Rqs 'muzzammilh26@gmail.com' dist/assets
          if grep -Rqs 'muzzammilhus26@gmail.com' dist/assets; then
            echo 'Outdated contact email detected in compiled site' >&2
            exit 1
          fi
      - name: Check for obsolete custom-domain settings in the site
        shell: bash
        run: |
          test ! -e public/CNAME
          test ! -e dist/CNAME
          if grep -Rqs 'portfolio.muzammilhussain.com' dist; then
            echo "An obsolete custom domain was found in the published site." >&2
            exit 1
          fi
          echo "No CNAME file or obsolete custom-domain redirect is present."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
