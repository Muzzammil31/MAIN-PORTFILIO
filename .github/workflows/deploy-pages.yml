name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy static portfolio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build static site
        run: npm run build
      - name: Smoke-test portfolio, chatbot and current CV
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/resume.pdf
          test -s dist/favicon.svg
          grep -Rqs 'Portfolio Assistant' dist/assets
          grep -Rqs 'muzzammilh26@gmail.com' dist/assets
          if grep -Rqs 'muzzammilhus26@gmail.com' dist/assets; then
            echo 'Outdated contact email detected in compiled site' >&2
            exit 1
          fi
      - name: Enforce free GitHub Pages URL (remove stale custom domains)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          printf '{"cname":null}' | gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" --input - > /dev/null
          domain="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq 'if .cname == null then "none" else .cname end')"
          if [ "$domain" != "none" ]; then
            echo "Unexpected custom domain remains configured: $domain" >&2
            exit 1
          fi
          echo "GitHub Pages custom domain cleared; using free github.io URL."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
